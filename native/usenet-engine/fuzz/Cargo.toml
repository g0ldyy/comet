[[bin]]
name = "nntp_protocol"
path = "fuzz_targets/nntp_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_detect"
path = "fuzz_targets/archive_detect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "par2_parse"
path = "fuzz_targets/par2_parse.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
