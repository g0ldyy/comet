[project]
name = "comet"
version = "0.1.0"
description = "Stremio's fastest torrent/debrid/usenet search add-on."
authors = [
    { name = "Goldy", email = "153996346+g0ldyy@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp",
    "aiohttp-socks",
    "aiosqlite",
    "asyncpg",
    "bencode-py",
    "curl-cffi",
    "databases",
    "demagnetize",
    "fastapi",
    "gunicorn",
    "idna",
    "loguru",
    "mediaflow-proxy==2.4.1",
    "orjson",
    "pydantic-settings",
    "prometheus-client",
    "python-multipart",
    "uvicorn",
    "uvicorn-worker",
    "cryptography",
    "websockets",
    "msgpack",
    "miniupnpc",
    "aiofiles",
    "torrent-parse-rank",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.ruff.lint]
# Broad exception handling is intentional at task, network, and plugin boundaries.
# ValueError is also part of the validation contract for malformed external data.
ignore = ["BLE001", "S110", "S112", "SIM117", "TRY004"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# These entrypoints must configure or validate process state before importing
# modules that construct application singletons.
"comet/api/app.py" = ["E402"]
"comet/cometnet/standalone.py" = ["E402"]
"comet/db_cli.py" = ["E402"]
"comet/main.py" = ["E402"]
"comet/web.py" = ["E402"]
# Standalone benchmarks add the repository root before importing Comet.
"scripts/run_usenet_provider_benchmark.py" = ["E402"]
"scripts/run_usenet_search_benchmark.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
torrent-parse-rank = { git = "https://github.com/g0ldyy/torrent-parse-rank" }
