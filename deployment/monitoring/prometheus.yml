global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: comet
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/comet_metrics_token
    static_configs:
      - targets:
          - comet:8000
        labels:
          service: comet
