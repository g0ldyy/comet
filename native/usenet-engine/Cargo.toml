[package]
name = "comet-usenet-engine"
version = "0.1.0"
edition = "2024"

[features]
quality-gates = []

[dependencies]
aes = "0.8"
quick-xml = "0.41"
crc32fast = "1.4"
flate2 = "1.1.9"
getrandom = "0.4.3"
libc = "0.2"
memchr = "2.7"
md-5 = "0.10"
mimalloc = "0.1.52"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sevenz-rust = { version = "0.6.1", default-features = false, features = ["aes256", "compress"] }
sha1 = "0.10"
sha2 = "0.10"
unicode-normalization = "0.1"
rustls = "0.23"
rustls-native-certs = "0.8"
rusqlite = { version = "0.37.0", features = ["bundled"] }
zeroize = "1.8"

[[bin]]
name = "usenet-engine"
path = "src/main.rs"

[profile.release]
strip = "symbols"

[dev-dependencies]
rcgen = { version = "0.14.8", default-features = false, features = ["aws_lc_rs", "pem"] }
